name: Build and Release

on:
  push:
    branches: [v2]
    tags: ['v*']
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            cgo: "1"
            cc: "gcc"
          - goos: linux
            goarch: arm64
            suffix: ""
            cgo: "1"
            cc: "aarch64-linux-gnu-gcc"
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            cgo: "0"
            cc: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
            cgo: "0"
            cc: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
            cgo: "0"
            cc: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          BINARY_NAME="sysmon${{ matrix.suffix }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/sysmon-*; do
            name=$(basename "$dir")
            # Extract os-arch from name (sysmon-linux-amd64 -> linux-amd64)
            arch=${name#sysmon-}
            if ls "$dir"/*.exe 1>/dev/null 2>&1; then
              zip -j "release/sysmon_${arch}.zip" "$dir"/*
            else
              tar czf "release/sysmon_${arch}.tar.gz" -C "$dir" .
            fi
          done
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
